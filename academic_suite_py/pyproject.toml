[tool.poetry]
name = "academic-suite-py"
version = "0.1.0"
description = "Python FastAPI backend for Academic Suite"
authors = ["Tejas <tejas@example.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "academic_suite_py"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
python-jose = "^3.3.0"
httpx = "^0.26.0"
redis = "^5.0.1"
aiosqlite = "^0.19.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.30"}
alembic = "^1.13.1"
python-dotenv = "^1.0.1"
fitz = "*"
PyMuPDF = "^1.24.2"
pdfplumber = "^0.10.2"
PyPDF2 = "^3.0.1"
weasyprint = "^60.2"
python-docx = "^1.1.2"
ruff = "^0.4.0"
black = "^24.3.0"

[tool.poetry.dev-dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.6"
coverage = "^7.5.0"
bandit = "^1.7.9"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
